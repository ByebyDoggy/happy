name: Unit tests

on:
    pull_request:
        paths:
            - 'packages/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - '.npmrc'
            - '.github/workflows/test.yml'
    push:
        branches:
            - main
        paths:
            - 'packages/**'
            - 'package.json'
            - 'pnpm-lock.yaml'
            - 'pnpm-workspace.yaml'
            - '.npmrc'
            - '.github/workflows/test.yml'

concurrency:
    group: unit-tests-${{ github.ref }}
    cancel-in-progress: true

jobs:
    unit-tests:
        name: unit tests (${{ matrix.os }})
        strategy:
            # Both platforms are the point, not a nicety: nothing else ran unit
            # tests on Windows, which is how three Windows-only failures sat in
            # happy-server and how the ripgrep and Claude-detection paths broke
            # outright. Let one platform's failure stay visible instead of
            # cancelling the other.
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            # postinstall also unpacks the committed difftastic/ripgrep archives
            # into tools/unpacked, which the ripgrep tests exercise, and generates
            # the Prisma client happy-server imports.
            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # First: happy-server and happy-agent resolve @slopus/happy-wire's
            # types from happy-wire/dist, which only its own build produces.
            - name: happy-wire unit tests
              run: pnpm --filter @slopus/happy-wire --fail-if-no-match test

            # `test` is `build && vitest run --project unit`: the CLI tests spawn
            # the built binary, and the integration projects hit real APIs, so
            # they stay out of this gate.
            - name: happy-cli unit tests
              run: pnpm --filter happy --fail-if-no-match test

            - name: happy-server unit tests
              run: pnpm --filter happy-server --fail-if-no-match test

            - name: happy-agent unit tests
              run: pnpm --filter happy-agent --fail-if-no-match test

            # The app's own `test` script is bare `vitest`, which would open a
            # watcher, so run it explicitly.
            - name: happy-app unit tests
              run: pnpm --filter happy-app --fail-if-no-match exec vitest run
